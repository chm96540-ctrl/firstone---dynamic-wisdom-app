[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardvault"
version = "0.1.0"
description = "Build pipeline for an offline trading-card catalog: card data, image fingerprints, signed price files."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "requests>=2.31",
    "cryptography>=42",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "open_clip_torch>=2.24"]
dev = ["pytest>=8"]

[project.scripts]
cardvault = "cardvault.cli:main"

[tool.setuptools.packages.find]
include = ["cardvault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
